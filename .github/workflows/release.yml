name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          BIN="target/${{ matrix.target }}/release/mew"
          STAGE="mew-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          else
            shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          fi
          ls -lh "$STAGE.tar.gz"*

      - name: package windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Target = "${{ matrix.target }}"
          $Tag = "${{ github.ref_name }}"
          $Stage = "mew-$Tag-$Target"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/$Target/release/mew.exe" "$Stage/"
          Copy-Item "README.md" "$Stage/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$Stage/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Stage/*" -DestinationPath "$Stage.zip" -Force
          $hash = (Get-FileHash "$Stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $Stage.zip" | Out-File "$Stage.zip.sha256" -Encoding ascii
          Get-ChildItem "$Stage.zip*"

      - name: upload release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            mew-*.tar.gz
            mew-*.tar.gz.sha256
            mew-*.zip
            mew-*.zip.sha256
